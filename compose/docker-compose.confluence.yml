services:
  confluence:
    # Pinned to exactly what runs on AKS today — `atlassian/confluence:latest`
    # there resolved to 10.2.18. A migration is not the moment for a version
    # jump; Renovate takes over from here (see renovate.json for why minor
    # releases are not auto-merged for Confluence).
    image: atlassian/confluence:10.2.18
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - dpv
    # Mirrors the environment of the AKS deployment one to one. The database
    # connection is deliberately NOT set here: with ATL_FORCE_CFG_UPDATE=false
    # Confluence ignores the ATL_JDBC_* variables and reads confluence.cfg.xml
    # in the home directory instead. That file also carries the server ID, the
    # license and the JWT keys, which is why it moves over with the home
    # directory and only its three hibernate.connection.* values get patched
    # (see MIGRATION.md, Phase 1).
    environment:
      # Test hostname until Cutover A, then wiki.dpvonline.de — see DOMAIN_WIKI
      # in terraform/variables.tf. Must match the host users type in, or
      # Tomcat generates redirects to the wrong name.
      ATL_PROXY_NAME: ${DOMAIN_WIKI}
      ATL_TOMCAT_SCHEME: https
      ATL_TOMCAT_SECURE: "true"
      ATL_FORCE_CFG_UPDATE: "false"
      JVM_MINIMUM_MEMORY: 1024m
      JVM_MAXIMUM_MEMORY: 3072m
    volumes:
      - /data/apps/confluence:/var/atlassian/application-data/confluence
    # Port 8090 is intentionally not published — Caddy reaches it over the
    # internal "dpv" network only. Synchrony (collaborative editing) runs as a
    # child process and is proxied through 8090 under /synchrony.
