# DPV-Anmeldetool (github.com/sebivtt/dpv-participant-management), Testumgebung.
#
# Part of the stack only once fetch-secrets.sh finds domain-anmeldetool and the other
# three Anmeldetool secrets in Key Vault (see COMPOSE_FILE there). The image is not
# built here: the app repo's workflow pushes it to GHCR with a version tag
# (YYYY.MM.DD-<run>), and scripts/deploy-anmeldetool.sh (dpv-anmeldetool-deploy.timer)
# pulls the newest one, sets ANMELDETOOL_VERSION and restarts the tool.
# Pipeline and one-time setup: README, "Anmeldetool: Image-Pipeline".

# Logging to journald, see docker-compose.yml.
x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  anmeldetool-db-init:
    # Role and database of the tool in the shared Postgres. init-db.sql only runs on an
    # empty cluster, so on the existing one this is what creates them. Idempotent, and
    # keeps the role's password in line with Key Vault. Runs on every `up`, then exits.
    # Waits for Postgres itself instead of a healthcheck on the postgres service: changing
    # that service would recreate the shared database on the next `up`.
    image: dpv-postgres:18-pgbackrest
    pull_policy: never
    restart: "no"
    logging: *logging
    depends_on:
      - postgres
    networks:
      - dpv
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD of the tool come from this file.
    env_file: anmeldetool.env
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    mem_limit: 128m
    # `$$` = a `$` for the shell, not for Compose. The password reaches psql through its
    # environment (`printenv`), never as an argument.
    command:
      - sh
      - -ec
      - |
        until pg_isready -q; do sleep 2; done
        psql -X -q -v ON_ERROR_STOP=1 -v "db=$$POSTGRES_DB" -v "usr=$$POSTGRES_USER" <<'SQL'
        \set pw `printenv POSTGRES_PASSWORD`
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'usr', :'pw')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'usr') \gexec
        SELECT format('ALTER ROLE %I PASSWORD %L', :'usr', :'pw') \gexec
        SELECT format('CREATE DATABASE %I OWNER %I ENCODING ''UTF8'' TEMPLATE template0', :'db', :'usr')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db') \gexec
        SQL

  anmeldetool:
    # A fixed version, set by deploy-anmeldetool.sh after a successful rollout (written
    # to .env, kept across reboots by fetch-secrets.sh). `latest` is only the fallback
    # before the first deploy. Migrations run when the container starts (docker/start.sh
    # in the app image), so they are part of the health check below.
    image: ghcr.io/sebivtt/dpv-participant-management:${ANMELDETOOL_VERSION:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      anmeldetool-db-init:
        condition: service_completed_successfully
    networks:
      - dpv
    # Secrets and settings, written by fetch-secrets.sh. The app's own list of settings
    # is testumgebung/.env.example in its repo.
    env_file: anmeldetool.env
    environment:
      # Fixed here, not in the env file, like in the app's testumgebung/docker-compose.yml:
      # banner "Testumgebung", noindex, no developer error pages, mails only into the log.
      # Remove it only together with the checks in docs/betrieb.md of the app repo.
      TEST_ENVIRONMENT: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    mem_limit: 512m
    # No published port: Caddy reaches it as anmeldetool:8000 over the "dpv" network.
    healthcheck:
      # Same check as the app's own compose file: does the web server accept connections.
      # start_period covers `migrate`, which runs before gunicorn starts.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  anmeldetool-aufraeumen:
    # Deletes expired sessions at start and then every 24 hours; Django never does
    # (docker/aufraeumen.sh in the app repo). Same image and env file as the tool.
    image: ghcr.io/sebivtt/dpv-participant-management:${ANMELDETOOL_VERSION:-latest}
    # The image is pulled by the deploy script; this one must never trigger its own pull.
    pull_policy: never
    command: ["sh", "docker/aufraeumen.sh"]
    restart: unless-stopped
    logging: *logging
    env_file: anmeldetool.env
    environment:
      TEST_ENVIRONMENT: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      # Only once the tool is up: it brings the database to the latest migration.
      anmeldetool:
        condition: service_healthy
    networks:
      - dpv
    # Passes the stop signal on to the script instead of waiting ten seconds for the sleep.
    init: true
    mem_limit: 256m
