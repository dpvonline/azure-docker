name: dpv-core

networks:
  dpv:
    name: dpv
    driver: bridge
    # IPv6 inside the Docker network, so that published ports reach Caddy via
    # ip6tables DNAT with the client's real address. Without it Docker still
    # accepts IPv6 on :443, but hands the connection over through its userland
    # proxy, and Caddy/Keycloak then see the Docker gateway instead of the
    # visitor (e.g. in Keycloak's login events). Docker 27+ picks a unique
    # local /64 for the network by itself, so no subnet is configured here.
    # Changing this recreates the network: `docker compose down` + `up`.
    enable_ipv6: true

volumes:
  caddy_data:
  caddy_config:

# Every service logs to the host's systemd journal instead of Docker's json
# files. Those disappear with the container — on every update or config change —
# which in October 2026 left the PHP2Shell check without the days that mattered.
# journald keeps them 30 days, across recreation
# (scripts/journald/10-dpv-retention.conf, README "Container-Logs"). Anchors
# only work within one file, so each compose file repeats this block, and a new
# service needs `logging: *logging` as well.
x-logging: &logging
  driver: journald
  options:
    # journalctl -t dpv-core-<service>-1
    tag: "{{.Name}}"

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    logging: *logging
    # Map form (not a list) so docker-compose.nextcloud.yml can add network
    # aliases to it.
    networks:
      dpv: {}
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_AUTH: ${DOMAIN_AUTH}
      DOMAIN_WIKI: ${DOMAIN_WIKI}
      # Always set, even before Nextcloud is deployed: the Caddyfile has site
      # blocks for both, and an empty site address would stop Caddy entirely.
      DOMAIN_CLOUD: ${DOMAIN_CLOUD}
      DOMAIN_OFFICE: ${DOMAIN_OFFICE}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
