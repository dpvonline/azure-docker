; OPcache JIT off. Since Cutover B on 23.10.2026 — same day as the update to
; Nextcloud 33.0.10 / PHP 8.4.27 — Apache children kept dying with
; "Segmentation fault" (677 by 28.10.), and once it started every new child
; crashed until Apache restarted. The image enables the tracing JIT
; (opcache.jit=1255); its code lives in shared memory, which matches that
; pattern, and JIT bugs on ARM64 typically only show under real load.
; Nextcloud gains little from the JIT; OPcache itself stays on.
; Mounted into nextcloud and nextcloud-cron (docker-compose.nextcloud.yml).
opcache.jit=disable
opcache.jit_buffer_size=0
