services:
  postgres:
    build: ./postgres
    image: dpv-postgres:18-pgbackrest
    restart: unless-stopped
    networks:
      - dpv
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Continuous WAL archiving to pgBackRest — at most 10 minutes of data loss
    # even if nothing is written (archive_timeout), point-in-time otherwise.
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest --stanza=main --config=/etc/pgbackrest/pgbackrest.conf archive-push %p"
      - "-c"
      - "archive_timeout=600"
    volumes:
      # Long syntax only for create_host_path: false. With the short syntax
      # Docker silently creates a missing source directory — on the OS disk,
      # since that is where / lives — and Postgres happily initializes there.
      # That is exactly how the data ended up on the OS disk and filled it
      # (see MIGRATION.md). Now compose refuses to start instead. This is the
      # second line of defense after the mountpoint check in
      # scripts/mount-data-disks.sh, and it also covers a hand-run
      # `docker compose up` that never goes through boot.sh.
      - type: bind
        source: /data/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    # Bound to the loopback interface only — NOT reachable from outside the VM
    # (the NSG blocks 5432 anyway, but binding to 127.0.0.1 means it never
    # listens on the public interface in the first place). This exists so an
    # admin can reach the database with a local GUI client through an SSH
    # tunnel: ssh -L 5432:localhost:5432 dpvadmin@<vm-ip>  (see README).
    ports:
      - "127.0.0.1:5432:5432"
