services:
  postgres:
    build: ./postgres
    image: dpv-postgres:18-pgbackrest
    restart: unless-stopped
    networks:
      - dpv
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Continuous WAL archiving to pgBackRest — at most 10 minutes of data loss
    # even if nothing is written (archive_timeout), point-in-time otherwise.
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest --stanza=main --config=/etc/pgbackrest/pgbackrest.conf archive-push %p"
      - "-c"
      - "archive_timeout=600"
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    # Bound to the loopback interface only — NOT reachable from outside the VM
    # (the NSG blocks 5432 anyway, but binding to 127.0.0.1 means it never
    # listens on the public interface in the first place). This exists so an
    # admin can reach the database with a local GUI client through an SSH
    # tunnel: ssh -L 5432:localhost:5432 dpvadmin@<vm-ip>  (see README).
    ports:
      - "127.0.0.1:5432:5432"
