# Mounted into the nextcloud container as /etc/apache2/conf-enabled/zz-dpv-mpm.conf
# (see docker-compose.nextcloud.yml). conf-enabled is read after mods-enabled,
# so these values replace the image's mpm_prefork defaults.
#
# Why: the default MaxRequestWorkers is 150. On 2026-11-11 a request pile-up
# drove Apache to 151 processes, each a mod_php worker of 50-300 MB, which
# exhausted the VM's 16 GB and took every service down via the OOM killer.
# A pile-up now queues in Apache's listen backlog instead of growing in memory.
#
# 30 workers cover normal load (sync clients, Collabora WOPI callbacks). Long
# uploads/downloads occupy a worker for their whole duration, so raise this
# only together with the container's mem_limit.
<IfModule mpm_prefork_module>
    StartServers            4
    MinSpareServers         4
    MaxSpareServers         8
    MaxRequestWorkers       30
    # Recycle workers so PHP memory growth cannot accumulate indefinitely.
    MaxConnectionsPerChild  500
</IfModule>
