# Compressed swap in RAM, installed to /etc/systemd/zram-generator.conf by
# cloud-init (see scripts/cloud-init.yaml.tftpl).
#
# The VM has no swap. On 2026-11-11 memory ran out, the OS disk thrashed on
# page-cache refills (queue depth ~290) and the machine was unreachable for
# ~20 minutes. zram gives the kernel headroom to evict cold anonymous pages
# without any disk I/O, so a short spike degrades instead of killing services.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
