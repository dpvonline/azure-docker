# Drop-in for Ubuntu's apt-daily-upgrade.timer, which runs unattended-upgrades
# (configured in scripts/apt/52dpv-unattended-upgrades). Installed by
# cloud-init (see scripts/cloud-init.yaml.tftpl).
#
# Ubuntu's default is 06:00 UTC plus up to an hour of random delay — 07:00 to
# 09:00 in Germany, with users already on. A Docker update restarts every
# container, so this moves the run into the night, ahead of everything else
# scheduled on the VM: the 01:00 Azure Backup, the 02:00 pgBackRest run, the
# Sunday 03:30 container update, the Sunday 04:10 reboot (only if an update
# asked for one, see dpv-reboot-if-required.timer) and the 04:30 Confluence
# prune.
[Timer]
OnCalendar=
OnCalendar=*-*-* 00:30:00
RandomizedDelaySec=0
