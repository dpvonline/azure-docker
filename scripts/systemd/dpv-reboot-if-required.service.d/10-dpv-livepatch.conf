# Drop-in for dpv-reboot-if-required.service, installed by cloud-init (see
# scripts/cloud-init.yaml.tftpl).
#
# The unit reboots every Sunday when an update asked for it. With Livepatch,
# a reboot that only kernel packages are waiting for can wait for the first
# Sunday of the month instead; scripts/reboot-due.sh makes that call (exit 1
# skips the unit, it does not fail). Added to the unit's own ExecCondition,
# both must pass. Without Livepatch — 24.04 on ARM64 — nothing changes.
[Service]
ExecCondition=/opt/dpv/scripts/reboot-due.sh
