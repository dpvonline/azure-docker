# Drop-in for docker.service, installed by cloud-init (see
# scripts/cloud-init.yaml.tftpl).
#
# Docker restarts the stack's containers on its own after a reboot
# (restart: unless-stopped), without boot.sh and its mount check. The data
# disks are in /etc/fstab with nofail, so a disk that fails to show up does
# not stop the boot — and Postgres would then initialise an empty cluster in
# the bare /data/postgres directory. With this, Docker only starts once all
# three disks are mounted; if one is missing, Docker (and with it the whole
# stack) stays down instead.
[Unit]
RequiresMountsFor=/data/postgres /data/apps /data/nextcloud
