# Drop-in for systemd-journald, installed by cloud-init (see
# scripts/cloud-init.yaml.tftpl); on the existing VM once by hand (README,
# "Container-Logs").
#
# Every container logs here (x-logging in compose/docker-compose*.yml), so this
# decides how long their logs survive: 30 days, also across container
# recreation. Should they outgrow the size limits below first, the oldest days
# go earlier — `journalctl --disk-usage` shows where it stands.
[Journal]
Storage=persistent
MaxRetentionSec=30day
# One file per day, so retention removes whole days. With the default of one
# month per file, a file only goes once its newest entry is 30 days old, which
# keeps the oldest lines up to 60 days.
MaxFileSec=1day
# The OS disk is 48 GiB. KeepFree stays above the disk alert's threshold (20 %
# free, terraform/monitoring.tf), so logs alone never trigger it.
SystemMaxUse=5G
SystemKeepFree=10G
# Docker hands over every container's lines as a single sender
# (docker.service). The default of 10000 per 30 seconds would drop lines in
# bursts — a scan, Confluence starting up — exactly when they matter.
RateLimitBurst=50000
